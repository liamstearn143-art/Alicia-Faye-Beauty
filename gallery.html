<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery | Alicia Faye Beauty</title>

<!-- Same fonts as the rest of the site -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Kalnia:wght@100..700&display=swap" rel="stylesheet">

<style>
  /* =====================================================
     BRAND TOKENS — copied straight from style.css so this
     drops into the site without clashing with anything.
  ===================================================== */
  :root {
    --primary: #6C8363;
    --background: #FAFAF8;
    --accent: #A37774;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Josefin Sans', sans-serif;
    background-color: var(--background);
    color: var(--primary);
  }

  h2, h3 { font-family: 'Kalnia', serif; }

  /* =====================================================
     HEADER / NAV — copied from style.css so this page
     matches every other page on the site exactly.
  ===================================================== */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    background-color: rgba(250, 250, 248, 0.95);
    backdrop-filter: blur(6px);
    padding: 1rem 2rem;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(108, 131, 99, 0.1);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .site-logo img {
    height: 40px;
    width: auto;
  }

  nav {
    display: flex;
    align-items: center;
  }

  nav ul {
    display: flex;
    justify-content: flex-end;
    gap: 1.5rem;
    list-style: none;
  }

  nav a {
    text-decoration: none;
    color: var(--primary);
    transition: color 0.3s ease;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  nav a:hover {
    color: var(--accent);
  }

  nav a.active {
    opacity: 0.6;
  }

  .menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 4px;
  }

  .menu-toggle span {
    width: 25px;
    height: 2px;
    background: var(--primary);
    border-radius: 2px;
    transition: all 0.3s ease;
  }

  @media (max-width: 768px) {
    nav ul {
      position: absolute;
      top: 70px;
      right: 0;
      background-color: var(--background);
      flex-direction: column;
      width: 200px;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 0 0 8px 8px;
    }

    nav ul.active {
      display: flex;
    }

    .menu-toggle {
      display: flex;
    }
  }

  /* Page offset so content clears the fixed header */
  .page-offset {
    padding-top: 150px;
  }

  /* =====================================================
     FOOTER — copied from style.css
  ===================================================== */
  footer {
    background-color: var(--primary);
    color: var(--background);
    text-align: center;
    padding: 2rem 1rem;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
  }

  footer a {
    color: var(--background);
    text-decoration: none;
    margin: 0 0.4rem;
  }

  footer a:hover {
    color: var(--accent);
  }

  footer .social-icons {
    margin-top: 10px;
  }

  footer .social-icons a {
    display: inline-block;
    line-height: 0;
  }

  footer .social-icons a svg {
    width: 30px;
    height: 30px;
    color: var(--background);
    transition: color 0.3s ease;
  }

  footer .social-icons a:hover svg {
    color: var(--accent);
  }

  /* =====================================================
     GALLERY SECTION
     Drop this whole <section class="gallery-dynamic">…</section>
     into any page. It pulls its content from the
     GALLERY_IMAGES array in the script at the bottom —
     nothing in this markup needs to change when you add
     or remove photos.
  ===================================================== */

  .gallery-dynamic {
    width: 100%;
    padding: 4rem 1.5rem;
  }

  .gallery-dynamic .section-inner {
    max-width: 1200px;
    margin: 0 auto;
  }

  .gallery-dynamic h2 {
    color: var(--primary);
    font-size: 2rem;
    text-align: center;
    margin-bottom: 0.75rem;
  }

  .gallery-dynamic .gallery-intro {
    max-width: 600px;
    margin: 0 auto 2.5rem;
    text-align: center;
    color: #444;
    line-height: 1.6;
    font-size: 1.05rem;
  }

  /* Grid — column-based masonry. Items flow into whichever
     column has room next, so mixed card heights (see .tall
     below) never leave empty gaps the way a strict grid would. */
  .gallery-grid {
    --card-ratio: 4 / 3;   /* width / height — try 1/1 for square, 16/10 for shorter */
    column-count: 3;
    column-gap: 1.25rem;
  }

  @media (max-width: 900px) {
    .gallery-grid { column-count: 2; }
  }

  @media (max-width: 520px) {
    .gallery-grid { column-count: 1; }
  }

  .gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    cursor: pointer;
    aspect-ratio: var(--card-ratio);
    break-inside: avoid;
    margin-bottom: 1.25rem;
    box-shadow: 0 6px 20px rgba(108, 131, 99, 0.08);
    transition: opacity 0.4s ease, transform 0.3s ease, box-shadow 0.3s ease;
  }

  /* Items marked tall: true use a slightly taller ratio
     instead of the grid default */
  .gallery-item.tall {
    aspect-ratio: 3 / 4;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .gallery-item:hover {
    box-shadow: 0 10px 26px rgba(108, 131, 99, 0.2);
  }

  .gallery-item:hover img {
    transform: scale(1.06);
  }

  /* Soft caption revealed on hover / focus */
  .gallery-item .caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0.9rem 1rem 0.7rem;
    background: linear-gradient(to top, rgba(108,131,99,0.75), rgba(108,131,99,0));
    color: #fff;
    font-size: 0.85rem;
    letter-spacing: 0.3px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .gallery-item:hover .caption,
  .gallery-item:focus-visible .caption {
    opacity: 1;
    transform: translateY(0);
  }

  .gallery-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* =====================================================
     LIGHTBOX
  ===================================================== */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(28, 33, 26, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-inner {
    max-width: 900px;
    width: 100%;
    text-align: center;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .lightbox .caption {
    color: var(--background);
    font-family: 'Josefin Sans', sans-serif;
    margin-top: 1rem;
    font-size: 1rem;
    letter-spacing: 0.3px;
  }

  .lightbox-close,
  .lightbox-prev,
  .lightbox-next {
    position: absolute;
    background: rgba(255,255,255,0.9);
    color: var(--primary);
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .lightbox-close:hover,
  .lightbox-prev:hover,
  .lightbox-next:hover {
    background: var(--accent);
    color: #fff;
  }

  .lightbox-close { top: 1.5rem; right: 1.5rem; }
  .lightbox-prev { left: 1.5rem; top: 50%; transform: translateY(-50%); }
  .lightbox-next { right: 1.5rem; top: 50%; transform: translateY(-50%); }

  @media (max-width: 640px) {
    .lightbox-prev, .lightbox-next { width: 38px; height: 38px; font-size: 1.1rem; }
    .lightbox-prev { left: 0.5rem; }
    .lightbox-next { right: 0.5rem; }
    .lightbox-close { top: 0.75rem; right: 0.75rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gallery-item, .gallery-item img, .caption, .lightbox { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1 class="site-logo">
      <a href="index.html">
        <img
          src="assets/AFBeauty-WM3_DG.png"
          alt="Alicia Faye Beauty"
        />
      </a>
    </h1>

    <nav>
      <div class="menu-toggle" id="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul id="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="prices.html">Prices</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="gallery-dynamic page-offset">
  <div class="section-inner">
    <h2>My Work</h2>
    <p class="gallery-intro">
      A look at recent treatments — including nail
      finishes, brow styling and skin therapies.
    </p>

    <!-- Grid is built automatically from GALLERY_IMAGES below -->
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</section>

<!-- Lightbox (shared, one per page) -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">‹</button>
  <button class="lightbox-next" id="lightboxNext" aria-label="Next image">›</button>
  <div class="lightbox-inner">
    <img id="lightboxImg" src="" alt="" />
    <p class="caption" id="lightboxCaption"></p>
  </div>
</div>

<script>
/* =========================================================
   ADD / REMOVE / REORDER IMAGES HERE — this is the only
   part of the file you need to touch day to day.

   Each entry:
     src      – path to the image (e.g. "assets/facial-2.jpg")
     alt      – short description for accessibility/SEO
     caption  – short text shown on hover and in the lightbox
     tall     – optional: set to true to make this tile span
                two rows in the grid, for a taller photo

   Nothing else in the page needs to change when you edit
   this list — the grid rebuilds itself.
========================================================= */
const GALLERY_IMAGES = [
  {
    src: "assets/eyes-1.png",
    alt: "Lash Lift & Tint",
    caption: "Lash Lift & Tint",
  },
  {
    src: "assets/nails-3.JPG",
    alt: "Floral Nail Art",
    caption: "Floral Nail Art",
  },
  {
    src: "assets/nails-9.JPG",
    alt: "Green Glitter Gels",
    caption: "Green Glitter Gels",
  },
  {
    src: "assets/room-1.JPG",
    alt: "Room Photo",
    caption: "Calming Room & Bed",
  },
  {
    src: "assets/eyes-3.png",
    alt: "Lashes & Brows",
    caption: "Lash & Brow Tint, with a Brow Wax",
  },
  {
    src: "assets/nails-7.JPG",
    alt: "Blue Polka Dot Nails",
    caption: "Blue Polka Dot Nails",
  },
  {
    src: "assets/nails-12.JPG",
    alt: "Pink French Tip Nails",
    caption: "Pink French Tip with Chrome Finish",
  },
  {
    src: "assets/toes-1.JPG",
    alt: "Glittery Blue Toes",
    caption: "Glittery Blue Toes",
  },
  {
    src: "assets/room-3.JPG",
    alt: "Massage Room & Bed",
    caption: "Massage Room & Bed Setup",
  },
  {
    src: "assets/eyes-2.JPG",
    alt: "Lash Lift & Tint",
    caption: "Lash Lift & Tint",
  },
  {
    src: "assets/underarm-1.JPG",
    alt: "Underarm Wax Before & After",
    caption: "Underarm Wax",
  },
  {
    src: "assets/nails-5.JPG",
    alt: "Spring Nail Art with Bees & Flowers",
    caption: "Spring Nail Art",
  },
  {
    src: "assets/nails-10.JPG",
    alt: "Burgundy and White Nail Art with stars",
    caption: "Burgundy and White Nail Art",
  }

];

/* =========================================================
   Below this line is the engine — no need to edit it.
========================================================= */
(function () {
  const grid = document.getElementById('galleryGrid');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');

  let currentIndex = 0;

  function renderGrid() {
    grid.innerHTML = '';
    GALLERY_IMAGES.forEach((imgData, i) => {
      const item = document.createElement('div');
      item.className = 'gallery-item' + (imgData.tall ? ' tall' : '');
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', 'View ' + imgData.caption);

      item.innerHTML =
        '<img src="' + imgData.src + '" alt="' + imgData.alt + '" loading="lazy" />' +
        '<div class="caption">' + imgData.caption + '</div>';

      item.addEventListener('click', () => openLightbox(i));
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox(i);
        }
      });

      grid.appendChild(item);
    });
  }

  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('open');
  }

  function updateLightbox() {
    const imgData = GALLERY_IMAGES[currentIndex];
    lightboxImg.src = imgData.src;
    lightboxImg.alt = imgData.alt;
    lightboxCaption.textContent = imgData.caption;
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
  }

  function step(delta) {
    currentIndex = (currentIndex + delta + GALLERY_IMAGES.length) % GALLERY_IMAGES.length;
    updateLightbox();
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', () => step(-1));
  document.getElementById('lightboxNext').addEventListener('click', () => step(1));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  renderGrid();
})();
</script>

<script>
  // Mobile nav toggle — same behaviour as the rest of the site's script.js
  const menuToggle = document.getElementById('menu-toggle');
  const navList = document.getElementById('nav-list');
  if (menuToggle && navList) {
    menuToggle.addEventListener('click', () => {
      navList.classList.toggle('active');
    });
  }
</script>

</body>
